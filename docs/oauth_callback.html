<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>contacts-calendar-downloader &mdash; authorization</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 40rem;
         padding: 0 1rem; line-height: 1.5; }
  code, #url { font-family: ui-monospace, monospace; word-break: break-all; }
  #url { display: block; background: #f4f4f5; padding: .75rem; border-radius: .375rem;
         font-size: .8rem; margin: 1rem 0; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .375rem;
           border: 1px solid #999; background: #fff; cursor: pointer; }
  .err { color: #b00; }
</style>
</head>
<body>
<h1 id="title">Almost done</h1>
<p id="intro">Copy the line below and paste it into the terminal where
<code>ccd login</code> is waiting.</p>
<code id="url"></code>
<button id="copy" type="button">Copy</button>
<p id="note"><small>This page is static: the value never leaves your browser
from here. It is already in this page's address bar &mdash; copying from there
works too.</small></p>
<script>
// Deliberately no network calls of any kind. The authorization code is
// single-use and, because ccd uses PKCE, useless without the code verifier
// that stays on the user's own machine.
(function () {
  var p = new URLSearchParams(location.search);
  var out = document.getElementById('url');
  if (p.get('error')) {
    document.getElementById('title').textContent = 'Authorization failed';
    document.getElementById('title').className = 'err';
    document.getElementById('intro').textContent =
      'Google returned an error. Return to the terminal and start over.';
    document.getElementById('copy').hidden = true;
    document.getElementById('note').hidden = true;
    out.textContent = p.get('error') + (p.get('error_description')
      ? ': ' + p.get('error_description') : '');
    return;
  }
  if (!p.get('code')) {
    document.getElementById('title').textContent = 'Nothing to copy';
    document.getElementById('intro').textContent =
      'Open this page only by completing the sign-in started by ccd login.';
    document.getElementById('copy').hidden = true;
    return;
  }
  out.textContent = location.href;
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    navigator.clipboard.writeText(location.href).then(function () {
      btn.textContent = 'Copied';
    }, function () {
      btn.textContent = 'Copy failed — select the text above';
    });
  });
})();
</script>
</body>
</html>
